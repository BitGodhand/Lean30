 class="card" style="margin-top:12px"><div class="actions"><button class="btn small outline" data-pantrysort="1">Suggest pantry-only swaps for next 7 days</button><button class="btn small" data-pantryreset="1">Restore shopping quantities</button></div><p class="inline-note">Pantry-only swaps work through the first 7 days and prioritize available stock, but cannot guarantee your protein goal. Check actual portions and packaging labels.</p></div><div class="card flat" style="margin-top:10px">${rows}</div>`}
function suggestPantryWeek(){const baseline={...state.pantry};const remaining={...baseline};const used=stockUsed();for(const [key,v] of Object.entries(used))remaining[key]=(remaining[key]||0)-v;

function pad(n){return String(n).padStart(2,'0')}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)}
function shift(s,days){const d=parseDate(s);d.setDate(d.getDate()+days);return iso(d)}
function dayDiff(a,b){return Math.round((Date.UTC(...a.split('-').map((v,i)=>i===1?Number(v)-1:Number(v)))-Date.UTC(...b.split('-').map((v,i)=>i===1?Number(v)-1:Number(v))))/86400000)}
function niceDate(s){return parseDate(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function round(n){return Math.round(n)}
function enc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeState(){return {settings:{startDate:'2026-11-09',startWeight:66.9,goalWeight:64.5,planned:1200,flexMin:300,flexMax:500,totalMin:1500,totalMax:1700,proteinGoal:120},selectedDate:'2026-11-09',plans:{},showBreakfast:{},logs:{},workouts:{},measurements:{'2026-11-08':{weight:66.9,waist:92}},groceriesChecked:{},manualGroceries:[],pantry:pantryInit()}}

function normalize(){const blank=makeState();state.settings={...blank.settings,...(state.settings||{})};for(const k of ['plans','showBreakfast','logs','workouts','measurements','groceriesChecked'])if(!state[k]||typeof state[k]!=='object')state[k]={};if(!Array.isArray(state.manualGroceries))state.manualGroceries=[];state.pantry={...pantryInit(),...(state.pantry||{})};if(!/^\d{4}-\d\d-\d\d$/.test(state.selectedDate||''))state.selectedDate=iso(new Date());}

"small" style="text-align:right;color:#c5e6db">Daily range<br><strong style="font-size:17px;color:var(--ink)">${settings.totalMin}–${settings.totalMax}</strong></div></div><div class="bars" style="margin:13px 0 7px"><div class="seg-planned" style="width:${pct(t.planned,settings.totalMax)}%"></div><div class="seg-flex" style="width:${pct(t.flex,settings.totalMax)}%"></div></div><div class="row"><span class="small" style="color:#cce1db">Meals ${round(t.planned)} kcal · Flex ${round(t.flex)} kcal</span><span class="small ${t.total>settings.totalMax?'pill-warn':'pill-good'}">${t.total<settings.totalMin?round(settings.totalMin-t.total)+' to minimum':t.total<=settings.totalMax?'Within range':round(t.total-settings.totalMax)+' over upper range'}</span></div></section><div class="grid" style="margin-top:10px"><div class="card tight stat"><div class="label">Protein logged</div><div class="num">${round(t.protein)}<span style="font-size:13px"> g</span></div><div class="progress ${t.protein>settings.proteinGoal?'':' '}" style="margin-top:8px"><i style="width:${pct(t.protein,settings.proteinGoal)}%"></i></div><div class="sub">Goal ${settings.proteinGoal} g</div></div><div class="card tight stat"><div class="label">Planned menu</div><div class="num">${round(planTotal)}<span style="font-size:13px"> kcal</span></div><div class="sub">Aim around ${settings.planned} before flex</div></div></div><div class="section-note" style="margin-top:12px">Budget: about <strong>${settings.planned} kcal of planned meals</strong> + <strong>${settings.flexMin}–${settings.flexMax} kcal</strong> for flexible food. On days without social snacks, use that remaining allowance for regular meals. Planned items do <strong>not</strong> count as eaten until logged.</div><div class="section-head"><h2>Today's meal plan</h2><span class="muted">Swap any dish</span></div><section class="card">${slots.map(s=>mealSlot(s,p[s.key],d)).join('')}<div class="row" style="margin-top:13px"><label for="breakfast-toggle" class if(target.matches('[data-check]')){state.groceriesChecked[target.dataset.check]=target.checked;save();render();return}
if(target.matches('[data-manualcheck]')){state.manualGroceries[Number(target.dataset.manualcheck)].checked=target.checked;save();render();return}
if(target.id==='import-file'&&target.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.settings||!data.logs||!data.plans||!data.workouts)throw Error('Invalid Lean30 backup');if(!confirm('Replace local app data with this backup?'))return;state=data;normalize();save();render();toast('Backup restored')}catch(err){alert('Unable to import: '+err.message)}};reader.readAsText(target.files[0]);return}}
function submitHandler(e){if(!['quick-start-form','custom-log-form','workout-form','measure-form','settings-form','grocery-form'].includes(e.target.id))return;e.preventDefault();const get=id=>document.getElementById(id).value;if(e.target.id==='quick-start-form'){const chosen=get('quick-start-date');if(!/^\d{4}-\d{2}-\d{2}$/.test(chosen))return alert('Choose a valid start date.');state.settings.startDate=chosen;state.selectedDate=chosen;save();render();toast('Day 1 changed to '+niceDate(chosen));return}if(e.target.id==='custom-log-form'){const title=get('custom-name').trim(),kcal=Number(get('custom-cal')),protein=Number(get('custom-pro')),quantity=Number(get('custom-qty')),group=get('custom-group');if(!title||![kcal,protein,quantity].every(Number.isFinite)||kcal<0||protein<0||quantity<=0)return alert('Enter valid food values.');logFood({title,kcal,protein},group,quantity);return}if(e.target.id==='workout-form'){state.workouts[state.selectedDate]={minutes:Number(get('work-mins')),effort:get('work-feel'),note:get('work-note').slice(0,500)};save();render();toast('Workout saved');return}if(e.target.id==='measure-form'){const date=get('measure-date'),weight=Number(get('measure-weight')),waist=get('measure-waist')?Number(get('measure-waist')):null;if(!weight||weight<20||weight>300)return alert('Please enter a valid weight.');state.measurements[date]={weight,waist};save();render();toast('Measurement saved');return}if(e.target.id==='grocery-form'){const name=get('grocery-add').trim();if(name){state.manualGroceries.push({name,checked:false});save();render();toast('Added to shopping list')}return}if(e.target.id==='settings-form'){const startDate=get('set-start'),startWeight=Number(get('set-weight')),goalWeight=Number(get('set-goal')),planned=Number(get('set-planned')),totalMin=Number(get('set-total-min')),totalMax=Number(get('set-total-max')),flexMin=Number(get('set-flex-min')),flexMax=Number(get('set-flex-max')),proteinGoal=Number(get('set-protein'));if(totalMax<totalMin||flexMax<flexMin||![startWeight,goalWeight,planned,totalMin,totalMax,proteinGoal].every(x=>Number.isFinite(x)&&x>0)){return alert('Check calorie ranges and required values.')}const changedStart=state.settings.startDate!==startDate;state.settings={startDate,startWeight,goalWeight,planned,totalMin,totalMax,flexMin,flexMax,proteinGoal};if(changedStart)state.selectedDate=startDate;save();render();toast('Preferences saved');return}}
document.addEventListener('click',clickHandler);document.addEventListener('change',changeHandler);document.addEventListener('submit',submitHandler);document.addEventListener('input',e=>{if(e.target.id==='recipe-search'){recipeQuery=e.target.value;const caret=e.target.selectionStart;render();const next=document.getElementById('recipe-search');next?.focus();next?.setSelectionRange(caret,caret)}});
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
